spring:
  application:
    name: kanban-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kanban}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:kanban1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update = 로컬 개발 중 엔티티 변경사항을 자동으로 테이블에 반영.
      # 운영 환경에서는 validate로 바꾸고 Flyway/Liquibase 같은 마이그레이션 도구 사용 권장.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 로컬 개발용 기본값 — 운영 배포 전에는 반드시 환경변수로 교체할 것.
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-before-deploy-please-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

spring:
  application:
    name: kanban-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kanban}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:kanban1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway(src/main/resources/db/migration)가 관리. Hibernate는 엔티티와
      # 실제 테이블이 일치하는지 검증만 하고 직접 DDL을 만들지 않는다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}

  security:
    oauth2:
      client:
        registration:
          # 구글은 Spring Security가 기본 제공하는 provider라 client-id/secret만 넣으면 됨.
          # https://console.cloud.google.com/apis/credentials 에서 발급, 승인된 리디렉션 URI는
          # {백엔드주소}/login/oauth2/code/google
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope: email,profile
          # 네이버는 표준 OIDC가 아니라서 provider 정보를 직접 지정해야 함.
          # https://developers.naver.com/apps 에서 발급, 콜백 URL은
          # {백엔드주소}/login/oauth2/code/naver
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 로컬 개발용 기본값 — 운영 배포 전에는 반드시 환경변수로 교체할 것.
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-before-deploy-please-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # 14일 — 로그아웃 시 Redis에서 즉시 무효화되므로 만료가 길어도 안전.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

app:
  # 프로젝트 파일 업로드 저장 위치. 나중에 S3로 옮길 때 FileStorageService 구현체만 교체하면 됨.
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    # 콤마로 여러 origin 지정 가능. 배포 시 CORS_ALLOWED_ORIGINS로 프론트 도메인 추가.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 소셜 로그인 성공/실패 후 리다이렉트할 프론트 주소.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # refresh token 쿠키의 Secure 속성. 로컬 http 개발은 false, HTTPS 배포 후에는 반드시 true로.
  cookie-secure: ${COOKIE_SECURE:false}

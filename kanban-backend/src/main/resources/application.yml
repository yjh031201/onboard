spring:
  application:
    name: kanban-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:kanban}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:kanban}
    password: ${DB_PASSWORD:kanban1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway(src/main/resources/db/migration)가 관리. Hibernate는 엔티티와
      # 실제 테이블이 일치하는지 검증만 하고 직접 DDL을 만들지 않는다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 로컬 개발용 기본값 — 운영 배포 전에는 반드시 환경변수로 교체할 것.
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-before-deploy-please-32bytes+}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # 14일 — 로그아웃 시 Redis에서 즉시 무효화되므로 만료가 길어도 안전.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

app:
  # 프로젝트 파일 업로드 저장 위치. 나중에 S3로 옮길 때 FileStorageService 구현체만 교체하면 됨.
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    # 콤마로 여러 origin 지정 가능. 배포 시 CORS_ALLOWED_ORIGINS로 프론트 도메인 추가.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

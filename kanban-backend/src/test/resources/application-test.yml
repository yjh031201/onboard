spring:
  autoconfigure:
    # Redisson은 기동 시 실제 Redis에 연결을 시도해서 테스트 환경(Docker 없이)에서 죽는다.
    # RedissonClient는 KanbanBackendApplicationTests에서 @MockBean으로 대체한다.
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  datasource:
    url: jdbc:h2:mem:kanban-test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # 운영 스키마는 Flyway(MySQL 전용 마이그레이션)가 관리하고, 테스트는 지금처럼
  # Hibernate ddl-auto=create-drop으로 H2 스키마를 즉석에서 만든다.
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-key-not-for-production-use-32bytes+
  expiration-ms: 3600000

name: Backend CI

on:
  pull_request:
    branches: [master]
    paths:
      - "kanban-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [master]
    paths:
      - "kanban-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanban-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 리포지토리에는 mvnw가 실행 권한 없이(100644) 커밋되어 있어 리눅스 러너에서 바로 실행 안 됨
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and test (H2, Docker/MySQL/Redis 불필요)
        run: ./mvnw -B test
